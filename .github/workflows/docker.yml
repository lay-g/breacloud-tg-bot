name: docker

# 打任意 tag 都构建多架构镜像并推到 GitHub Container Registry。
# 镜像名取自仓库本身：ghcr.io/<owner>/<repo>，与 Makefile 的推导结果一致。
#
# amd64 与 arm64 各在对应架构的原生 runner 上构建，不交叉编译、不走 QEMU：
# build 两个 job 各推一个不带 tag 的 by-digest 镜像，merge 再用 imagetools
# 把两个 digest 合成多架构 manifest（所有标签都指向它）。
# arm64 runner 是 GitHub 标准规格，私有仓库同样可用。
#
# 镜像里的版本号取自根目录 VERSION 文件（形如 v0.1.0）；tag 必须与它完全一致，只用来打镜像标签。
#
# 手动触发：Actions → docker → Run workflow，镜像标签同样取自 VERSION（不产分支名、
# commit sha 之类的临时标签，也不动 latest）。
# 首次推送后，包默认是私有的；要在别处拉取需要 docker login ghcr.io，
# 或者到 Packages 设置里改成 public。

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest      # 原生 amd64
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm   # 原生 arm64
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # tag 是发布动作，版本以根目录 VERSION 为准：两者不一致直接失败，
      # 免得镜像标签和二进制里报的版本对不上。
      - name: 校验 tag 与 VERSION
        if: github.ref_type == 'tag'
        run: test "$(cat VERSION)" = "$GITHUB_REF_NAME"

      # by-digest 推送需要 docker-container driver，默认的 docker driver 不支持。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号由 Dockerfile 从根目录 VERSION 文件读取，这里只注入 commit。
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 一个空的、以 digest 为文件名的标记文件，merge job 靠它拿到两个 digest。
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # merge 需要读 VERSION：手动触发没有版本 tag，镜像标签直接用它。
      # tag 推送时 build job 已校验 tag 与 VERSION 一致，两种触发都归一到 VERSION。
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 版本号带 v 前缀，镜像标签照搬；写了 prefix= 的两行（VERSION、latest）
          # 值本身已含 v，不再加前缀。没有分支名、commit sha 之类的临时标签。
          # latest=auto 关掉，latest 只由下面那条显式规则产生：含 -dev 的版本、
          # 以及手动触发都不碰它。
          flavor: |
            prefix=v
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }},prefix=,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,prefix=,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-dev') }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" $(printf "$IMAGE@sha256:%s " *)
          done
