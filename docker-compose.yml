# BreaCloud Telegram Bot —— Docker Compose 部署
#
#   1. 准备凭据（只存在宿主机上，以环境变量传给容器）
#        cp .env.example .env && chmod 600 .env && ${EDITOR:-vi} .env
#   2. 启动
#        docker compose up -d && docker compose logs -f
#
# 镜像默认来自 GitHub Container Registry。想用本地构建的版本：
#   docker compose build          # 用本仓库源码构建，仍打同一个镜像名
# 想换版本或换仓库，在 .env 里设置 IMAGE / VERSION 即可：
#   IMAGE=ghcr.io/lay-g/breacloud-tg-bot
#   VERSION=v0.1.0
#
# 为什么用环境变量而不是挂配置文件：容器以非 root（uid 65532）运行，
# 挂在宿主机的 0600 配置文件它读不到；放宽到 644 又等于把 token 交给本机所有用户。
#
# 注意：同一个 Bot token 不能被两个进程同时拉取更新。如果本机还跑着 systemd 服务，
# 先停掉：breacloud-tg-bot service stop

services:
  bot:
    # 镜像名与仓库一致（ghcr.io/<owner>/<repo>），build 与 image 用同一个名字，
    # 因此 `docker compose build` 之后 `docker compose up` 用的就是本地那份。
    image: ${IMAGE:-ghcr.io/lay-g/breacloud-tg-bot}:${VERSION:-latest}
    build:
      context: .
      # 不传 VERSION：镜像里的版本号由 Dockerfile 从仓库根目录 VERSION 文件读取，
      # 上面的 ${VERSION} 只用来选镜像标签。
    container_name: breacloud-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 通知时间按这个时区计算。容器默认 UTC，不设的话你定的 09:00 会在
      # 北京时间 17:00 才推送。
      TZ: ${TZ:-Asia/Shanghai}
      # 数据库落在命名卷里，容器重建不丢白名单、设置与预警去重状态
      BREACLOUD_TG_BOT_DATABASE_PATH: /data/bot.db
      BREACLOUD_TG_BOT_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bot-data:/data

volumes:
  bot-data:
